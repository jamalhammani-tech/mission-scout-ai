services:
  postgres:
    image: postgres:16-alpine
    container_name: mission-scout-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memory_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memory_agent}
      POSTGRES_DB: ${POSTGRES_DB:-memory_agent}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memory_agent} -d ${POSTGRES_DB:-memory_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
