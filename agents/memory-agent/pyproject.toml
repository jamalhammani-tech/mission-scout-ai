[project]
name = "memory-agent"
version = "0.1.0"
description = "Memory Agent — source de vérité du profil, des référentiels et de l'historique de recherche de mission (Jamal AI Agent)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
