[project]
name = "cv-agent"
version = "0.1.0"
description = "cv-agent — import et analyse de CV (PDF/DOCX), alimente le profil via le Memory Agent"
requires-python = ">=3.11"
dependencies = [
    "memory-agent",
    "anthropic>=0.40",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pydantic-settings>=2.4",
]

[project.scripts]
import-cv = "cv_agent.cli:main"

[tool.uv.sources]
memory-agent = { path = "../memory-agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "fpdf2>=2.7",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "N", "RUF", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["cv_agent"]

[tool.ruff.lint.per-file-ignores]
"src/cv_agent/cli.py" = ["T20"]  # sortie utilisateur du CLI, pas du logging

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
