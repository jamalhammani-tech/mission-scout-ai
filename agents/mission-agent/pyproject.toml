[project]
name = "mission-agent"
version = "0.1.0"
description = "mission-agent (Career Scout Agent) — import, analyse et scoring de missions IT, alimente le Memory Agent"
requires-python = ">=3.11"
dependencies = [
    "memory-agent",
    "anthropic>=0.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic-settings>=2.4",
]

[project.scripts]
scout = "mission_agent.cli:main"

[tool.uv.sources]
memory-agent = { path = "../memory-agent", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mission_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-beautifulsoup4>=4.12",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "N", "RUF", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["mission_agent"]

[tool.ruff.lint.per-file-ignores]
"src/mission_agent/cli.py" = ["T20"]  # sortie utilisateur du CLI, pas du logging

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
